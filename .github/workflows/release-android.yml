name: Release Android

on:
  push:
    tags:
      - "android/v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: app/android

      - name: Build release APK and AAB
        run: >
          ./gradlew assembleRelease bundleRelease
          -PversionName=${GITHUB_REF_NAME#android/v}
          -PversionCode=${{ github.run_number }}
        working-directory: app/android

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: app/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Sign AAB
        uses: r0adkll/sign-android-release@v1
        id: sign_aab
        with:
          releaseDirectory: app/android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.sign_apk.outputs.signedReleaseFile }}
            ${{ steps.sign_aab.outputs.signedReleaseFile }}

      # The upload runs after the release so that a refusal on the Play side — a versionCode
      # already used, a listing left incomplete — costs the Play publication only, and not the
      # signed artifacts, which stay attached to the GitHub Release either way.
      - name: Check for Google Play credentials
        id: play_credentials
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SERVICE_ACCOUNT_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not set - skipping the Google Play upload."
          fi

      - name: Publish AAB to Google Play (internal track)
        if: steps.play_credentials.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mara.jordan.app
          releaseFiles: ${{ steps.sign_aab.outputs.signedReleaseFile }}
          # The APK is for sideloading from the GitHub Release; Play takes the bundle only.
          track: internal
          status: completed
          # minifyEnabled is on, so without this file the stack traces in Play Console are
          # obfuscated names.
          mappingFile: app/android/app/build/outputs/mapping/release/mapping.txt
