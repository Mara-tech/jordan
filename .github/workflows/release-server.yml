name: Release Server

on:
  push:
    tags:
      - "server/v*"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#server/v}" >> $GITHUB_ENV

      # A Docker repository name must be lowercase, and the owner is `Mara-tech`:
      # `${{ github.repository_owner }}` used as is would make the push fail
      # with "repository name must be lowercase" (JRD-22).
      - name: Compute the image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/jordan-server" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: server/
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          # links the package to this repository on ghcr.io
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
