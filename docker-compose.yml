services:
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    environment:
      REDIS_ARGS: "--requirepass jordan_dev"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "jordan_dev", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  jordan-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: jordan_dev
      # No TLS: the two containers talk over a private docker network, and this
      # Redis serves no certificate. A managed instance reached over the
      # internet is the case that needs REDIS_SSL=true.
      REDIS_SSL: "false"
      # Local development token for /jordan/admin/* — override for any real deployment
      JORDAN_ADMIN_TOKEN: ${JORDAN_ADMIN_TOKEN:-jordan_dev_admin_token}
      # Named operator accounts (JSON array); build entries with:
      #   python server/admin_identity.py <login> <password> [viewer|operator|admin]
      JORDAN_ADMIN_USERS: ${JORDAN_ADMIN_USERS:-[]}
      JORDAN_ADMIN_SESSION_TTL: ${JORDAN_ADMIN_SESSION_TTL:-43200}
      # Passive client registration: open when the key is empty, as in local development
      JORDAN_REGISTRATION_KEY: ${JORDAN_REGISTRATION_KEY:-}
      JORDAN_REGISTRATION_RATE_LIMIT: ${JORDAN_REGISTRATION_RATE_LIMIT:-20}
      JORDAN_REGISTRATION_RATE_WINDOW: ${JORDAN_REGISTRATION_RATE_WINDOW:-60}
      # This stack is the local development one, so it publishes Swagger UI —
      # a public deployment leaves the variable unset and serves the API alone.
      # The Werkzeug debugger stays off even here: the port is published on the
      # host, and it is a Python console for anyone who reaches it.
      JORDAN_ENABLE_DOCS: ${JORDAN_ENABLE_DOCS:-true}
      JORDAN_DEBUG: ${JORDAN_DEBUG:-false}
    depends_on:
      redis:
        condition: service_healthy
